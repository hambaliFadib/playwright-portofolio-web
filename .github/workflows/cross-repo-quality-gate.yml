name: Portfolio Playwright Quality Gate
on:
  workflow_call:
    inputs:
      application_repository:
        required: true
        type: string
      application_test_sha:
        required: true
        type: string
      application_pr_head_sha:
        required: true
        type: string
      qa_source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-qa-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      PORTFOLIO_APP_REPOSITORY: ${{ inputs.application_repository }}
      PORTFOLIO_APP_TEST_SHA: ${{ inputs.application_test_sha }}
      PORTFOLIO_APP_PR_HEAD_SHA: ${{ inputs.application_pr_head_sha }}
      PORTFOLIO_QA_SOURCE_SHA: ${{ inputs.qa_source_sha }}
      PORTFOLIO_EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
      PORTFOLIO_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      PORTFOLIO_PR_NUMBER: ${{ github.event.pull_request.number || '' }}

    steps:
      - name: Validate caller identity and SHA inputs
        shell: bash
        run: |
          set -euo pipefail
          sha_re='^[0-9a-fA-F]{40}$'
          [[ "$PORTFOLIO_APP_REPOSITORY" == "hambaliFadib/portofolio-web" ]]
          [[ "$GITHUB_REPOSITORY" == "hambaliFadib/portofolio-web" ]]
          [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]
          [[ "$PORTFOLIO_EVENT_BASE_REF" == "dev" ]]
          [[ "$PORTFOLIO_PR_NUMBER" =~ ^[0-9]+$ ]]
          for value in "$GITHUB_SHA" "$PORTFOLIO_APP_TEST_SHA" "$PORTFOLIO_APP_PR_HEAD_SHA" "$PORTFOLIO_EVENT_HEAD_SHA" "$PORTFOLIO_QA_SOURCE_SHA"; do
            [[ "$value" =~ $sha_re ]]
          done
          [[ "$(printf '%s' "$PORTFOLIO_APP_TEST_SHA" | tr '[:upper:]' '[:lower:]')" == "$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]')" ]]
          [[ "$(printf '%s' "$PORTFOLIO_APP_PR_HEAD_SHA" | tr '[:upper:]' '[:lower:]')" == "$(printf '%s' "$PORTFOLIO_EVENT_HEAD_SHA" | tr '[:upper:]' '[:lower:]')" ]]
          printf "Caller event validated: %s %s PR #%s\n" "$GITHUB_EVENT_NAME" "$PORTFOLIO_EVENT_BASE_REF" "$PORTFOLIO_PR_NUMBER"
          printf "Application head: %s\nTested merge: %s\nQA source pin: %s\n" "$PORTFOLIO_APP_PR_HEAD_SHA" "$PORTFOLIO_APP_TEST_SHA" "$PORTFOLIO_QA_SOURCE_SHA"

      - name: Checkout pinned QA implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hambaliFadib/playwright-portofolio-web
          ref: ${{ inputs.qa_source_sha }}
          path: portfolio-qa
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact application PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.application_repository }}
          ref: ${{ inputs.application_test_sha }}
          path: portfolio-app
          fetch-depth: 1
          persist-credentials: false

      - name: Set isolated checkout and report paths
        shell: bash
        run: |
          set -euo pipefail
          echo "PORTFOLIO_QA_ROOT=$GITHUB_WORKSPACE/portfolio-qa" >> "$GITHUB_ENV"
          echo "PORTFOLIO_APP_ROOT=$GITHUB_WORKSPACE/portfolio-app" >> "$GITHUB_ENV"
          echo "PORTFOLIO_TEST_REPORT=$GITHUB_WORKSPACE/portfolio-qa/artifacts/all-results.json" >> "$GITHUB_ENV"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portfolio-qa/package-lock.json
            portfolio-app/package-lock.json

      - name: Verify exact checked-out revisions
        id: revisions
        working-directory: portfolio-qa
        run: node scripts/verify-revisions.js

      - name: Install locked QA dependencies
        working-directory: portfolio-qa
        run: npm ci

      - name: Install locked application dependencies
        working-directory: portfolio-app
        run: npm ci

      - name: Verify fail-closed negative contracts
        id: gate_selftest
        working-directory: portfolio-qa
        run: npm run quality-gate:selftest

      - name: Framework policy self-test
        id: policy_selftest
        working-directory: portfolio-qa
        run: npm run policy:selftest

      - name: Framework AI triage boundary self-test
        id: triage_selftest
        working-directory: portfolio-qa
        run: npm run triage:selftest

      - name: Framework bounded AI contract checks
        id: ai_contract
        working-directory: portfolio-qa
        run: npm run contract:ai

      - name: Build exact application revision
        id: app_build
        working-directory: portfolio-app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PORTFOLIO_QA_ROOT/artifacts"
          npm run build 2>&1 | tee "$PORTFOLIO_QA_ROOT/artifacts/portfolio-build.log"

      - name: Install Playwright Chromium and Linux dependencies
        id: chromium
        working-directory: portfolio-qa
        run: npx playwright install --with-deps chromium

      - name: Run lint, policy, secret scan and Playwright against owned server
        id: validate
        working-directory: portfolio-qa
        run: node scripts/with-app-server.js

      - name: Require exactly seven passing tests and zero skips
        id: report_gate
        if: always()
        working-directory: portfolio-qa
        run: node scripts/verify-test-report.js "$PORTFOLIO_TEST_REPORT"

      - name: Record final provenance
        id: provenance
        if: always()
        working-directory: portfolio-qa
        run: node scripts/record-provenance.js --final

      - name: Write GitHub job summary
        if: always()
        env:
          REVISION: ${{ steps.revisions.outcome }}
          SELFTEST: ${{ steps.gate_selftest.outcome }}
          POLICY: ${{ steps.policy_selftest.outcome }}
          TRIAGE: ${{ steps.triage_selftest.outcome }}
          CONTRACT: ${{ steps.ai_contract.outcome }}
          BUILD: ${{ steps.app_build.outcome }}
          CHROMIUM: ${{ steps.chromium.outcome }}
          VALIDATION: ${{ steps.validate.outcome }}
          REPORT: ${{ steps.report_gate.outcome }}
          PROVENANCE: ${{ steps.provenance.outcome }}
          APP_HEAD: ${{ inputs.application_pr_head_sha }}
          APP_TEST: ${{ inputs.application_test_sha }}
          QA_SOURCE: ${{ inputs.qa_source_sha }}
          FRAMEWORK: b5b46cc60b834ffe5ae0fcfc38d8d87921bd490d
        shell: bash
        run: |
          {
            echo "# Portfolio Playwright Quality Gate"
            echo
            echo "| Evidence | Result |"
            echo "|---|---|"
            printf "| Application PR head SHA | %s |\n" "$APP_HEAD"
            printf "| Application tested merge SHA | %s |\n" "$APP_TEST"
            printf "| QA implementation checkout SHA | %s |\n" "$QA_SOURCE"
            printf "| Adopted framework SHA | %s |\n" "$FRAMEWORK"
            printf "| Revision verification | %s |\n" "$REVISION"
            printf "| Gate negative self-test | %s |\n" "$SELFTEST"
            printf "| Framework policy self-test | %s |\n" "$POLICY"
            printf "| AI triage boundary self-test | %s |\n" "$TRIAGE"
            printf "| AI contract checks | %s |\n" "$CONTRACT"
            printf "| Exact application build | %s |\n" "$BUILD"
            printf "| Chromium provisioning | %s |\n" "$CHROMIUM"
            printf "| Lint, policy, secret scan and 7 Playwright tests | %s |\n" "$VALIDATION"
            printf "| Strict test report gate | %s |\n" "$REPORT"
            printf "| Final provenance | %s |\n" "$PROVENANCE"
            echo
            echo "This shadow-mode check does not enable branch protection."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports, provenance and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-qa-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            portfolio-qa/artifacts/
            portfolio-qa/playwright-report/
            portfolio-qa/test-results/
          if-no-files-found: warn
          retention-days: 14
